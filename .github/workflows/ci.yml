name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.env == 'default' && 'nightly' || matrix.env }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        env: [default, stable]
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          # Pinned: pixi.lock is written by this version, and pixi changed how
          # it hashes source dependencies after it, so a newer pixi rejects the
          # committed lock with "lock file not up-to-date".
          pixi-version: v0.78.0
          environments: ${{ matrix.env }}

      # Linux is the interesting leg: pthread_setaffinity_np is a real pin
      # there (a no-op on macOS), and the pthread symbols come out of libc
      # rather than libSystem. Both are exercised by the suite.
      - name: Unit tests
        run: pixi run -e ${{ matrix.env }} test

      - name: Lint (mojolint --lsp)
        run: pixi run -e ${{ matrix.env }} lint

      - name: Demo CLI builds and runs
        run: |
          pixi run -e ${{ matrix.env }} cli
          ./build/threads-mojo info
          ./build/threads-mojo bench --elements 4000000

  # The sanitizer gate. `tests/stress_threads.mojo` is built with a sanitizer
  # and run in a loop; any finding in the output fails the job. Stable only,
  # deliberately: nightly here would be a second toolchain's sanitizer runtime
  # to keep green for no extra signal, and this repo's history with nightly +
  # pixi-build source deps under pixi 0.78 is not encouraging.
  #
  # Which sanitizer runs where is decided by the toolchain rather than by
  # preference — see the two comments below. Between them the two platforms
  # cover both, which is the reason to run the leg on both.
  stress:
    name: stress / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.78.0
          environments: stable

      # Without a sanitizer first, so that a plain wrong answer is
      # distinguishable from a race — and so a sanitizer-only failure is known
      # to be about ordering rather than arithmetic.
      - name: Stress (no sanitizer)
        run: pixi run -e stable stress

      # macOS only. On linux-64 with Mojo 1.0.0 a `--sanitize thread` binary
      # links and then aborts before `main`: the runtime's bundled TCMalloc
      # cannot get its 1 GiB-aligned mmap inside the address space TSan has
      # reserved ("MmapAligned() failed ... TCMalloc assumes a 48-bit virtual
      # address space"). A hello-world fails the same way, and disabling ASLR
      # does not help, so it is the toolchain rather than this code.
      - name: Stress under ThreadSanitizer
        if: runner.os == 'macOS'
        run: pixi run -e stable stress-tsan

      # Linux only, and the mirror image: `--sanitize address` does not link on
      # osx-arm64 with this toolchain (undefined
      # `___asan_version_mismatch_check_v8`, with or without
      # `--shared-libasan`), but it builds and runs here, LeakSanitizer
      # included.
      - name: Stress under AddressSanitizer
        if: runner.os == 'Linux'
        run: pixi run -e stable stress-asan
